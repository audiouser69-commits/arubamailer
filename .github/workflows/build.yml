name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Build
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ArubaMailer ArubaMailer.pyw
      - name: Smoke test engine
        run: python -c "import mailer_engine as m; print(m.estimate(2000,250,6,35))"
      - uses: actions/upload-artifact@v4
        with:
          name: ArubaMailer-exe
          path: dist/ArubaMailer.exe
      - name: Publish exe on branch "exe"
        shell: bash
        run: |
          mkdir out && cp dist/ArubaMailer.exe LEGGIMI.txt out/
          cd out
          git init -q -b exe
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "ArubaMailer.exe build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" exe
